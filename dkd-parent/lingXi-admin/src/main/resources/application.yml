# 项目相关配置
ruoyi:
  # 名称
  name: zjk
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径
  profile: ${RUOYI_PROFILE:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 密码错误最大重试次数
user:
  password:
    maxRetryCount: 5
    lockTime: 10

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为 8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.dkd: debug
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期
  expireTime: 120

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.lingXi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper*/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# springdoc 开关与 swagger.enabled 同步
springdoc:
  api-docs:
    enabled: ${swagger.enabled:false}
  swagger-ui:
    enabled: ${swagger.enabled:false}

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
#文件上传
dromara:
  x-file-storage: #文件存储配置
    default-platform: aliyun-oss-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    #对应平台的配置写在这里，注意缩进要对齐
    aliyun-oss:
      - platform: aliyun-oss-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: ${OSS_ACCESS_KEY:}
        secret-key: ${OSS_SECRET_KEY:}
        end-point: ${OSS_ENDPOINT:}
        bucket-name: ${OSS_BUCKET_NAME:}
        domain: ${OSS_DOMAIN:} # 访问域名，注意"/"结尾
        base-path: ${OSS_BASE_PATH:} # 基础路径

# LingXi-Agent 配置
agent:
  base-url: http://localhost:5000
  # Java -> Python service authentication. Configure the same value as
  # SERVICE_API_KEY in lingXi-agent.
  service-api-key: ${AGENT_SERVICE_API_KEY:}
  chat-invoke-url: /api/v1/chat/invoke
  chat-stream-url: /api/v1/chat/stream
  chat-stream-v2-url: /api/v1/chat/stream
  chat-resume-url: /api/v1/chat/resume
  smart-questions-url: /api/v1/chat/smart-questions
  memory-list-url: /api/v1/chat/memory/list
  memory-preference-url: /api/v1/chat/memory/preference
  memory-clear-url: /api/v1/chat/memory
  novel-stream-url: /api/v1/novel/write/stream
  novel-thread-delete-url: /api/v1/novel/thread
  novel-synopsis-url: /api/v1/novel/synopsis/generate
  novel-synopsis-stream-url: /api/v1/novel/synopsis/stream
  novel-outline-url: /api/v1/novel/outline/generate
  style: professional
  max-iterations: 5
  connect-timeout: 5000
  read-timeout: 60000
  # 单轮业务工具令牌仅短期有效，并限制最多调用次数
  tool-token-ttl-seconds: 300
  tool-max-calls-per-run: 5
  # 阶段5受控写操作默认关闭；完成数据库迁移并启用持久 checkpoint 后再显式开启
  write-actions-enabled: ${AGENT_WRITE_ACTIONS_ENABLED:false}
  write-action-proposal-ttl-minutes: 15
# Video Generation API 配置 (调用 Python Agent)
video:
  base-url: http://localhost:5000
  generate-image-url: /api/v1/video/generate-image
  submit-video-url: /api/v1/video/submit-video
  query-video-url: /api/v1/video/query-video
  analyze-chapter-url: /api/v1/video/analyze-chapter
  analyze-chapter-stream-url: /api/v1/video/analyze-chapter/stream
  connect-timeout: 5000
  image-read-timeout: 200000
  # Python 每次章节 LLM 请求最多等待 7 分钟；会随 llm_config.timeout_seconds 搬运
  chapter-provider-read-timeout-seconds: 420
  # 逐场景生成使用流式进度保持连接；30 分钟读取超时为单次静默等待提供充足余量
  chapter-read-timeout: 1800000
  video-read-timeout: 60000

# AI 视频图片任务节流配置
aivideo:
  video:
    provider: happyhorse
    poll-interval-ms: 15000
    # 到达重试时间的视频任务重新投递扫描间隔
    retry-recovery-interval-ms: 10000
  outbox:
    # 投递事件扫描间隔
    dispatch-interval-ms: 2000
  callback:
    # 供应商回调共享密钥（HMAC-SHA256 验签）；留空则拒绝所有回调
    shared-secret: ${AIVIDEO_CALLBACK_SECRET:}
    # 回调时间戳允许的最大时钟偏差（秒），防重放
    clock-skew-seconds: 300
  story-bible:
    # 进程重启后恢复排队中章节任务的扫描间隔
    queued-recovery-interval-ms: 15000
  scheduler:
    # 图片同步生成不会阻塞视频供应商任务轮询
    pool-size: 2
  image:
    # Qwen Image 同步生成请求之间的最小间隔
    request-min-interval-ms: 2000
    # Qwen Image 2.0 使用同步生成接口，允许最长 3 分钟响应
    sync-read-timeout-ms: 180000
    # 进程中断后恢复未完成图片任务的扫描间隔
    queued-recovery-interval-ms: 10000

management:
  # Actuator 健康检查与指标端点暴露（供监控系统抓取 Micrometer 指标）
  endpoints:
    web:
      exposure:
        include: health,info,metrics
