name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lingXi-vue/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lingXi-agent/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lingXi-vue/src-tauri -> target
          cache-on-failure: true
      - name: Check release version and signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (!$env:SIGNING_KEY) { throw '请先配置 TAURI_SIGNING_PRIVATE_KEY，禁止发布无法验签的更新。' }
          $version = (Get-Content lingXi-vue/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content lingXi-vue/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          [xml]$pom = Get-Content dkd-parent/pom.xml
          if ($tauriVersion -ne $version -or $pom.project.version -ne $version) { throw '前端、后端与桌面版本号必须一致。' }
          $tag = "desktop-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw '标签与应用版本号不一致。' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - run: npm ci
        working-directory: lingXi-vue
      - name: Offline desktop tests
        run: python -m unittest discover -s desktop -p 'test_*.py' -v
      - name: Frontend tests
        run: npm test
        working-directory: lingXi-vue
      - name: Java tests and package
        run: mvn -B -pl lingXi-admin -am package -DskipTests=false
        working-directory: dkd-parent
      - name: Prepare complete offline runtime
        run: ./desktop/prepare.ps1 -SkipBackendBuild
      - name: Verify first launch and relaunch with isolated data
        run: python desktop/smoke.py lingXi-vue/src-tauri/runtime
      - name: Build signed installer and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_BASE_API: http://127.0.0.1:18080
        with:
          projectPath: lingXi-vue
          args: --config src-tauri/tauri.full.conf.json --bundles nsis
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '灵犀完整桌面版 v__VERSION__'
          releaseBody: |
            Windows x64 完整桌面安装包，内含前端、Java 业务服务、Python AI 服务、MySQL、Redis 和 WebView2 离线安装器。
            安装后打开即可启动本机服务，无需另行部署数据库或安装开发环境。
            数据保存在 %LOCALAPPDATA%\com.lingxi.terminal\server；升级保留本机数据。
            AI 推理仍需联网，并在模型管理中配置供应商 API Key；上传与生成资产需配置 OSS。
            默认账号见根 README，首次登录后请修改密码。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Verify installed native desktop application
        run: ./desktop/verify-install.ps1
      - name: Publish only after installer and updater manifest exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if (!$release.assets.Where({ $_.name -eq 'latest.json' }) -or !$release.assets.Where({ $_.name -like '*.exe' }) -or !$release.assets.Where({ $_.name -like '*.sig' })) {
            throw 'Release 产物不完整，保留草稿，不对用户推送更新。'
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败' }
      - name: Retain Rust lockfile and installer for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: |
            lingXi-vue/src-tauri/Cargo.lock
            lingXi-vue/src-tauri/target/release/bundle/nsis/*.exe
            lingXi-vue/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: ignore
